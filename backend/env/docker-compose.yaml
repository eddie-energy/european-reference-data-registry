name: ceeds-backend

services:
  postgres:
    image: postgres:17
    ports:
      - "5440:5432"
    environment:
      POSTGRES_DB: ${BACKEND_DB_NAME}
      POSTGRES_USER: ${BACKEND_DB_USERNAME}
      POSTGRES_PASSWORD: ${BACKEND_DB_PASSWORD}
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U ${BACKEND_DB_USERNAME} -d ${BACKEND_DB_NAME}'" ]
      interval: 10s
      timeout: 3s
      retries: 3

  keycloak:
    image: ceeds-keycloak:26.7.5
    build:
      context: ./keycloak
    command: [ "start-dev" ]
    ports:
      - "8081:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      CEEDS_BOOTSTRAP_DEMO_USER: "true"
      CEEDS_DIRECTORY_CLIENT_SECRET: ${CEEDS_DIRECTORY_CLIENT_SECRET:-ceeds-directory-dev-secret}
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "/opt/keycloak/bootstrap/healthcheck.sh" ]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
