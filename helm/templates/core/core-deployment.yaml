{{- if eq .Values.core.enabled true }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-core
  labels:
    {{- include "european-reference-data-registry.selectorLabels.core" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
        {{- include "european-reference-data-registry.selectorLabels.core" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "european-reference-data-registry.selectorLabels.core" . | nindent 8 }}
    spec:
      containers:
        - name: backend
          image: "{{ .Values.core.image.name }}:{{ .Values.core.image.tag }}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_DB_USERNAME
              value: "backend"
            - name: BACKEND_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret.name }}
                  key: password
            - name: BACKEND_DB_URL
              value: "jdbc:postgresql://{{ .Release.Name }}-postgres:5432/backend"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: {{ include "european-reference-data-registry.keycloak.url" . | quote }}/realms/ceeds 
            - name: KEYCLOAK_HOST
              value: {{ include "european-reference-data-registry.keycloak.url" . | quote }}
            - name: KEYCLOAK_AUTHORIZATION_URL
              value: "{{ include "european-reference-data-registry.keycloak.url" . }}/realms/ceeds/protocol/openid-connect/auth"
            - name: KEYCLOAK_TOKEN_URI
              value: "{{ include "european-reference-data-registry.keycloak.url" . }}/realms/ceeds/protocol/openid-connect/token"
            - name: KEYCLOAK_JWK_SET_URI
              value: "{{ include "european-reference-data-registry.keycloak.url" . }}/realms/ceeds/protocol/openid-connect/certs"
            - name: KEYCLOAK_ISSUER_URI
              value: "{{ include "european-reference-data-registry.keycloak.url" . }}/realms/ceeds"
          {{- include "european-reference-data-registry.resources" .Values.core.resources | nindent 10 }}

      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
{{- end }}

