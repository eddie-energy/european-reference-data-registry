name: Publish Helm chart

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  keycloak-image:
    uses: ./.github/workflows/keycloak-image.yml
    permissions:
      contents: read
      packages: write
    with:
      publish: true

  package-and-push-chart:
    needs: keycloak-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            -u ${{ github.actor }} --password-stdin

      - name: Package and push chart
        env:
          KEYCLOAK_IMAGE_TAG: ${{ needs.keycloak-image.outputs.image-tag }}
        run: |
          helm lint helm --set-string "keycloak.image.version=$KEYCLOAK_IMAGE_TAG"
          helm package helm --destination /tmp/chart-dist --app-version "$KEYCLOAK_IMAGE_TAG"
          chart_file=$(ls /tmp/chart-dist/european-reference-data-registry-*.tgz)
          helm push "$chart_file" oci://ghcr.io/eddie-energy/charts

