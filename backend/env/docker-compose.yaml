name: ceeds-backend

services:
  postgres:
    image: postgres:17
    ports:
      - "5440:5432"
    environment:
      POSTGRES_DB: ${BACKEND_DB_NAME}
      POSTGRES_USER: ${BACKEND_DB_USERNAME}
      POSTGRES_PASSWORD: ${BACKEND_DB_PASSWORD}
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U ${BACKEND_DB_USERNAME} -d ${BACKEND_DB_NAME}'" ]
      interval: 10s
      timeout: 3s
      retries: 3

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: [ "start-dev", "--import-realm" ]
    ports:
      - "8081:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    env_file:
      - .env
    volumes:
      - ./keycloak/ceeds-realm.json:/opt/keycloak/data/import/ceeds-realm.json:ro
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"UP\"'" ]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
