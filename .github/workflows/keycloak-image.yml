name: Build CEEDS Keycloak

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
    outputs:
      image-tag:
        description: Immutable tag verified by container acceptance tests
        value: ${{ jobs.keycloak.outputs.image-tag }}

jobs:
  keycloak:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: azure/setup-helm@v4
      - name: Image coordinates
        id: image
        shell: bash
        run: |
          echo "tag=snapshot-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ceeds-keycloak" >> "$GITHUB_OUTPUT"
      - name: Environment contract tests
        run: python3 -m unittest discover -s backend/env/keycloak/tests -v
      - name: Build image (includes provider tests)
        uses: docker/build-push-action@v6
        with:
          context: backend/env/keycloak
          load: true
          tags: ceeds-keycloak:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container acceptance tests
        run: python3 backend/env/keycloak/tests/smoke.py ceeds-keycloak:test
      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        if: inputs.publish
        uses: docker/build-push-action@v6
        with:
          context: backend/env/keycloak
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha
