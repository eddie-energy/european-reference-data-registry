management:
  endpoint:
    health:
      show-details: always
  health:
    defaults:
      enabled: true

spring:
  profiles:
    active: local
  application:
    name: backend
  datasource:
    url: ${backend.db.url}
    username: ${backend.db.username}
    password: ${backend.db.password}
  flyway:
    enabled: true
    locations: 'classpath:db/backend/migration'
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/ceeds
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: 'true'

springdoc:
  # Spec-first: Swagger UI renders the authored contract served as a static resource,
  # not a definition generated from the controllers.
  swagger-ui:
    url: /backend-api.yml

keycloak:
  host: http://localhost:8081
  realm: ceeds
  authorization-uri: http://localhost:8081/realms/ceeds/protocol/openid-connect/auth
  token-uri: http://localhost:8081/realms/ceeds/protocol/openid-connect/token
  client: ceeds-frontend
  issuer-uri: http://localhost:8081/realms/ceeds
  jwk-set-uri: http://localhost:8081/realms/ceeds/protocol/openid-connect/certs

backend:
  db:
    url: jdbc:postgresql://localhost:5440/backend
    username: backend
    password: backend

app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:8080
