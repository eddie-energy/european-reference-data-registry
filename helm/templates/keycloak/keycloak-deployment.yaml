{{- if eq .Values.keycloak.enabled true }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-keycloak
  labels:
    {{- include "european-reference-data-registry.selectorLabels.keycloak" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
        {{- include "european-reference-data-registry.selectorLabels.keycloak" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "european-reference-data-registry.selectorLabels.keycloak" . | nindent 8 }}
    spec:
      containers:
        - name: keycloak
          image: "{{ .Values.keycloak.image.name }}:{{ .Values.keycloak.image.version | default .Chart.AppVersion | required "Set keycloak.image.version to a published CEEDS Keycloak tag; packaged charts provide Chart.appVersion." }}"
          args: [ "start" ]
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.secret.name }}
                  key: admin-password
            - name: KC_HOSTNAME
              value: {{ include "european-reference-data-registry.keycloak.url" . | quote }}
            - name: KC_HTTP_RELATIVE_PATH
              value: {{ .Values.keycloak.httpRelativePath | quote }}
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: CEEDS_DIRECTORY_CLIENT_SECRET
              value: {{ .Values.keycloak.directoryClientSecret | quote }}
            - name: CEEDS_FRONTEND_URLS
              value: {{ .Values.keycloak.frontendUrls | default (printf "%s://%s" (ternary "https" "http" .Values.ingress.tls.enabled) .Values.ingress.host) | quote }}
            - name: CEEDS_BOOTSTRAP_DEMO_USER
              value: "false"
            {{- if hasKey .Values.keycloak.bootstrap "organizations" }}
            - name: CEEDS_BOOTSTRAP_ORGANIZATIONS
              value: {{ .Values.keycloak.bootstrap.organizations | quote }}
            {{- end }}
            {{- if hasKey .Values.keycloak.bootstrap "roles" }}
            - name: CEEDS_BOOTSTRAP_ORGANIZATION_ROLES
              value: {{ .Values.keycloak.bootstrap.roles | quote }}
            {{- end }}
            {{- if hasKey .Values.keycloak.bootstrap "nations" }}
            - name: CEEDS_BOOTSTRAP_ORGANIZATION_NATIONS
              value: {{ .Values.keycloak.bootstrap.nations | quote }}
            {{- end }}
          startupProbe:
            exec:
              command: [ "/opt/keycloak/bootstrap/healthcheck.sh" ]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 40
          readinessProbe:
            exec:
              command: [ "/opt/keycloak/bootstrap/healthcheck.sh" ]
            periodSeconds: 5
            timeoutSeconds: 3
          {{- include "european-reference-data-registry.resources" .Values.keycloak.resources | nindent 10 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
