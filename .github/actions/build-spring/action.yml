name: "Build Spring Application"
description: "Build Spring Application with gradle"

inputs:
  application-name:
    description: "Application name"
    required: true

runs:
  using: "composite"
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: "21"
        distribution: "temurin"

    - name: Gradle Build
      shell: bash
      run: ./gradlew build -x test

