core:
  enabled: true
  image:
    name: ghcr.io/eddie-energy/european-reference-data-registry
    tag: snapshot-b9deb7ae344aad1a63b3ab324bd9b02034a7fb6d

postgres:
  enabled: false
  storageSize: 10Gi
  image:
    name: postgres
    version: 18.4-alpine
  existingSecret:
    name: postgres-secret
  database: backend
  owner: backend
  storageSize: 10Gi

keycloak:
  enabled: true
  image:
    name: ghcr.io/eddie-energy/ceeds-keycloak
    # Empty uses Chart.appVersion, pinned to published snapshot by chart CI.
    version: ""
  httpRelativePath: /auth
  directoryClientSecret: ceeds-directory-dev-secret
  # Empty URLs use ingress host; explicit semicolon-separated URLs override it.
  frontendUrls: ""
  # All omitted: seed FHOOE. Set organizations: "" to disable seeding.
  bootstrap: {}
  # Example:
  # bootstrap:
  #   organizations: "fhooe;eda;enedis"
  #   roles: "OPERATIONAL_ENTITY;NDSF;NDSF"
  #   nations: ";AUT;FRA"
  secret:
    name: keycloak-secret

ingress:
  enabled: false
  host: localhost
  tls:
    enabled: false
    clusterIssuer: eddie-letsencrypt-prod
    secretName: eddie-letsencrypt-prod

